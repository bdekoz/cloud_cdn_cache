<script>
    var bgBanner = new Swiper('#mephoto-bigview', {
        effect:'fade',
        autoplay: {
            delay: 3000,
            disableOnInteraction: false,
        },
        speed:800,
        on:{
            init:function(){
                $('#mephoto-smview li').eq(0).addClass('on')
            },
            transitionStart: function(){
                var mvid = bgBanner.activeIndex
                $('#mephoto-smview li').eq(mvid).addClass('on').siblings().removeClass('on')
            },
        },
    })
    bgBanner.autoplay.stop();
    $('.js-play').click(function(){
        if(bgBanner.autoplay.running){
            bgBanner.autoplay.stop()
            $(this).html('<i class="iconfont icon-play3"></i>')
        }else{
            bgBanner.autoplay.start()
            $(this).html('<i class="iconfont icon-pause"></i>')
        }
    })
    var smBanner = new Swiper('#mephoto-smview', {
        slidesPerView:isMobile() ? 3 : 8,
        speed:800,
        slidesOffsetAfter:$('.sm-btn').outerWidth()*2,
        navigation: {
            nextEl: '.sm-next',
            prevEl: '.sm-prev',
        },
    })
    $('#mephoto-smview li').mouseover(function(){
        var sid = $(this).index()
        $(this).addClass('on').siblings().removeClass('on')
        bgBanner.slideTo(sid)
    })
</script>
